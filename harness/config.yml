disabledProviders: 
  - claude
  - claude-plugins
  - codex
  - cursor
  - windsurf
  - cline
  - github
skills: 
  enableClaudeUser: false
  enableClaudeProject: false
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
tools: 
  approval: write
modelRoles:
  # Code generation - default: optimal  
  code-cheap: deepseek/deepseek-v4-flash-0731
  code-optimal: google/gemini-3.7-flash
  code: code-optimal  # default tier
  
  # Reasoning & orchestration - default: optimal
  reason-cheap: google/gemini-3.7-flash
  reason-optimal: z-ai/glm-5.3
  reason: reason-optimal  # default tier
  
  # Content creation - default: cheap
  content-cheap: deepseek/deepseek-v4-flash-0731
  content-optimal: z-ai/glm-5.3
  content: content-cheap  # default tier
  
  # Research & analysis - default: cheap  
  research-cheap: deepseek/deepseek-v4-flash-0731
  research-optimal: z-ai/glm-5.3
  research: research-cheap  # default tier
  
  # General tiers — switch with /model @cheap, /model @super-cheap (Ctrl+P cycles)
  super-cheap: deepseek/deepseek-v4-flash-0731
  cheap: google/gemini-3.7-flash

  # Cross-cutting roles
  advisor: z-ai/glm-5.3
  default: z-ai/glm-5.3
# Ctrl+P model cycling: cheapest -> most capable
cycleOrder:
  - super-cheap
  - cheap
  - default
memory: 
  backend: mnemopi
memories: 
  maxRolloutAgeDays: 30
  minRolloutIdleHours: 12
  summaryInjectionTokenLimit: 3000
mnemopi: 
  retainEveryNTurns: 4
  recallLimit: 8
  injectionTokenLimit: 3000
setupVersion: 1