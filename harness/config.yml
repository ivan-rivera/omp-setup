disabledProviders:
  - claude
  # claude-plugins must stay enabled: it is the provider that loads OMP marketplace
  # plugin installs under ~/.omp/plugins (e.g. the impeccable design skill).
  # Claude Code's own ~/.claude registry is separately gated behind the
  # enabledProviders opt-in and stays unloaded.
  - codex
  - cursor
  - windsurf
  - cline
  - github
skills:
  enableClaudeUser: false
  enableClaudeProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
tools:
  approval: write
modelRoles:
  # Four conceptual models (see skills/model-scout). Working lineup 2026-10-10: all GLM 5.3.
  # default: general-purpose workhorse (intelligence benchmarks)
  # code: code generation (coding benchmarks) | agentic: task execution (agentic benchmarks)
  # Oracle: top-tier consult — ONLY user-approved paths (/advisor on, Ctrl+P). Never automatic.
  default: openrouter/z-ai/glm-5.3
  code: openrouter/z-ai/glm-5.3
  agentic: openrouter/z-ai/glm-5.3
  task: "@agentic"
  oracle: openrouter/anthropic/claude-opus-5.5
  advisor: "@oracle"
cycleOrder:
  - default
  - oracle
task:
  agentModelOverrides:
    task: "@agentic"
    sonic: "@agentic"
memory:
  backend: mnemopi
memories:
  maxRolloutAgeDays: 30
  minRolloutIdleHours: 12
  summaryInjectionTokenLimit: 3000
mnemopi:
  retainEveryNTurns: 4
  recallLimit: 8
  injectionTokenLimit: 3000
setupVersion: 2
composer:
  shape: band
temperature: 0.6
minP: 0.05