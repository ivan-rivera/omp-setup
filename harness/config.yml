# Disable all external config discovery sources.
# OMP reads ONLY from its native .omp/ directories (our harness/ symlink).
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - cursor
  - windsurf
  - cline
  - github

# Also disable Claude-specific skill/command discovery toggles
skills:
  enableClaudeUser: false
  enableClaudeProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false

tools:
  approval: write

# Model roles: {domain}-{tier} convention
# TBD entries are placeholders for model-scout to fill based on benchmarks
modelRoles:
  # Code domain
  code-best: TBD
  code-balanced: anthropic/claude-sonnet-4
  code-fast: google/gemini-2.5-flash
  code-free: TBD

  # Reasoning domain
  reason-best: anthropic/claude-opus-4
  reason-balanced: anthropic/claude-sonnet-4
  reason-fast: google/gemini-2.5-flash
  reason-free: TBD

  # Content domain
  content-best: TBD
  content-balanced: anthropic/claude-sonnet-4
  content-fast: google/gemini-2.5-flash
  content-free: TBD

  # Research domain
  research-best: TBD
  research-balanced: google/gemini-2.5-pro
  research-fast: google/gemini-2.5-flash
  research-free: TBD

  # Orchestration domain
  orch-best: TBD
  orch-balanced: anthropic/claude-sonnet-4
  orch-fast: google/gemini-2.5-flash
  orch-free: TBD

  # Cross-cutting
  advisor: openai/gpt-4.1
  fast: google/gemini-2.5-flash
  local: ollama/placeholder

  # Default fallback
  default: anthropic/claude-sonnet-4

# Memory: mnemopi backend (local SQLite)
memory:
  backend: mnemopi
memories:
  maxRolloutAgeDays: 30
  minRolloutIdleHours: 12
  summaryInjectionTokenLimit: 3000

mnemopi:
  retainEveryNTurns: 4
  recallLimit: 8
  injectionTokenLimit: 3000
