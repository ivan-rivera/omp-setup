# Default orchestration formula for the `orchestrate` skill.
# There is no compiler: an OMP agent following the orchestrate skill reads this
# file and interprets it at plan time. Edit values to shape how goals run;
# keep names and units exactly as documented in the skill's reference.md.
# Copy to <repo>/.orchestrate/formulas/<name>.toml to customize per project.

formula = "standard-goal"
description = "Standard goal orchestration: full control pipeline, converged workers in worktrees, independent verification, cost report, archive."

# Variables the dispatching agent or user may override at launch.
# {{name}} placeholders in any text field below expand to these values.
[vars]
# Hard cap on simultaneously active worker tabs per milestone workspace.
max_parallel_workers_per_milestone = 3
# When true, every task's acceptance criteria must be executable commands.
require_acceptance_commands = true
# Model for worker agents; empty string = harness default model.
worker_model = ""
# When the goal coordinator notifies the user: escalations | all | none.
notify_on = "escalations"
# Out-of-band delivery target for needs-human escalations and completion
# (hermes send -t <target>): e.g. "slack:C0C9JFJG943", "telegram", "discord:#ops".
# Empty string = off (default) — nothing leaves the machine unless you opt in.
notify_target = ""

# Control pipeline. These step ids are reserved and have fixed semantics;
# the orchestrator executes them in dependency order, not file order.
[[steps]]
id = "clarify"
title = "Clarify objective"
description = "Interview the user until objective, scope, and constraints are unambiguous; resolve the suitability gate."
needs = []

[[steps]]
id = "charter"
title = "Write charter"
description = "Record goal.md: objective, scope, non-goals, constraints, acceptance criteria, formula, and links."
needs = ["clarify"]

[[steps]]
id = "launch"
title = "Launch goal session"
description = "Start the herdr session, controller workspace, patrol pane, milestone workspaces, and lead agents."
needs = ["charter"]

[[steps]]
id = "execute"
title = "Execute tasks"
description = "Leads decompose milestones into disjoint tasks; workers converge in their own worktrees with typed escalations."
needs = ["launch"]

[[steps]]
id = "verify"
title = "Verify independently"
description = "Fresh context-free verifier subagents check each task's acceptance commands in the worker's worktree."
needs = ["execute"]

[[steps]]
id = "integrate"
title = "Integrate milestone work"
description = "Leads merge verified task branches into milestone branches; the controller resolves cross-milestone conflicts."
needs = ["verify"]

[[steps]]
id = "report"
title = "Report and account cost"
description = "Write reports/final report.md with results, evidence, and the AgentsView cost summary (or 'cost unavailable')."
needs = ["integrate"]

[[steps]]
id = "archive"
title = "Archive and tear down"
description = "After user confirmation, archive the ledger, prune worktrees, and stop and delete the goal's herdr session."
needs = ["report"]

# To customize, add work steps after the control pipeline. Work steps map to
# milestones (kind = "milestone") or to tasks inside execute. Example:
#
# [[steps]]
# id = "design"
# title = "Design"
# description = "Produce the interface contracts for {{project}} before implementation."
# kind = "milestone"
# needs = ["charter"]
#
# [[steps]]
# id = "implement"
# title = "Implement"
# description = "Implement against the design contracts."
# needs = ["design"]
# condition = "{{require_acceptance_commands}} == true"

# Convergence: how hard a worker tries before escalating.
[policies.convergence]
# Failed iterations allowed before the lead consults the oracle (@oracle subagent).
max_iterations = 3
# Consult the oracle after exhaustion instead of going straight to needs_human.
oracle_on_exhaustion = true
# Extra attempts granted after an oracle diagnosis.
oracle_retries = 1

# Verification: fresh subagent with no implementation context judges each task.
[policies.verification]
independent = true

# Health patrol: plain shell-loop pane (no LLM) appending heartbeats.
[policies.health]
patrol = true
interval_s = 120
stale_after_s = 1800
# Isolation: one git worktree per task, outside the main working tree.
[policies.isolation]
worktrees = true
path_template = "../<repo>-orchestrations/<goal>/<task>"

# Reporting: query AgentsView MCP for token cost over the goal window.
[policies.reporting]
cost = true

# Archive: move the ledger out of the repo after completion.
[policies.archive]
enabled = true
root = "~/.omp/orchestration-archive"
